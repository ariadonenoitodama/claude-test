<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原田琢 - 自己紹介</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #eaf2fb;
      color: #1a3a5c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: #ffffff;
      border-top: 6px solid #2d7dd2;
      border-radius: 8px;
      padding: 48px 56px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(45, 125, 210, 0.12);
    }

    .name {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #1a3a5c;
      margin-bottom: 4px;
    }

    .name-reading {
      font-size: 0.85rem;
      color: #6a9cc9;
      letter-spacing: 0.15em;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid #d0e4f7;
      margin-bottom: 28px;
    }

    .info-item {
      display: flex;
      align-items: baseline;
      margin-bottom: 18px;
    }

    .label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #2d7dd2;
      letter-spacing: 0.1em;
      min-width: 80px;
      text-transform: uppercase;
    }

    .value {
      font-size: 1rem;
      color: #2c4e70;
    }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #a0bcd8;
      text-align: right;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">原田 琢</div>
    <div class="name-reading">HARADA TAKU</div>
    <hr class="divider">
    <div class="info-item">
      <span class="label">職業</span>
      <span class="value">インタビュアー</span>
    </div>
    <div class="info-item">
      <span class="label">好きなこと</span>
      <span class="value">囲碁</span>
    </div>
    <div class="footer">自己紹介</div>
  </div>
</body>
</html>
